[project]
name = "edu-system"
version = "0.1.0"
description = "School Management System — modular monolith for Indonesian schools"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "celery>=5.6.3",
    "daphne>=4.2.3",
    "django>=6.1",
    "django-celery-beat>=2.1.0",
    "django-ckeditor>=6.7.3",
    "django-extensions>=4.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]


# ---------------------------------------------------------------------------
# ruff — Run: ruff (requires pip install ".[dev]" to include ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
"migrations", 
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]

ignore = [
    "E501",  # line too long (handled by black)
    "E266",  # too many leading '#' for block comment
    "E402",  # module level import not at top of file
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    "C408",  # unnecessary dict call - rewrite as a literal
    "DJ001", # avoid using null=True on string-based fields
    "DJ008", # model does not define __str__ method
]

[tool.ruff.lint.per-file-ignores]
# Django settings modules intentionally re-export via wildcard import.
"config/settings/__init__.py" = ["F401", "F403"]
"config/settings/local.py" = ["F401", "F403", "F405"]
"config/settings/production.py" = ["F401", "F403", "F405"]
"__init__.py" = ["F401", "F403"]  # unused imports and import * in __init__.py
"*/migrations/*.py" = ["E501", "DJ", "F401", "F403"]  # long lines, Django checks, and imports in migrations
"*/tests/*.py" = ["B011"]  # assert False, assert usage, and hardcoded passwords in tests
"**/test_*.py" = ["B011"]  # same for test files
"conftest.py" = ["F401", "F403"]  # unused imports in conftest
"settings/*.py" = ["F403", "F405"]  # import * and unable to detect undefined names in settings
"manage.py" = ["E402"]  # module level import not at top of file

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["apps", "config", "tools"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

# ---------------------------------------------------------------------------
# pytest — Run: pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py", "tests.py", "_tests.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "*_test"]
testpaths = [".", "tests"]
addopts = [
    "--strict-markers",
    "--reuse-db",
    "-x",
    "--cov=config",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-n", "auto",
    "--dist", "loadscope",
]

log_level = "DEBUG"
log_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: Unit test — single function/class, no DB or network I/O.",
    "integration: Integration test — multiple components, DB, services, or Celery tasks.",
    "feature: Feature test — full HTTP request/response cycle via DRF APIClient.",
]
django_find_project = false

filterwarnings = [
    "ignore::django.utils.deprecation.RemovedInDjango61Warning",
    "ignore::django.utils.deprecation.RemovedInDjango70Warning",
]

# ---------------------------------------------------------------------------
# coverage — Run: coverage (requires pip install ".[dev]" to include pytest-cov)
# ---------------------------------------------------------------------------
[tool.coverage.run]
data_file = "htmlcov/ .coverage"
branch = true
source = ["config", "apps", "tools"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "*/apps.py",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError", 
    "if TYPE_CHECKING:",
    "def __repr__",
]

[tool.coverage.html]
directory = "htmlcov"
